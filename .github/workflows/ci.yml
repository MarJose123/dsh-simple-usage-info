# Tests on every push and pull request; publishes to npm on a GitHub Release
# (or from the Actions tab). See the README's "Publishing" section for the one
# time Trusted Publisher setup on npmjs.com.
#
# The test job installs with bun (the repo's dev package manager, via the
# committed bun.lock). The publish job is deliberately npm-only and installs
# nothing: the published files are committed sources, so `npm publish` just packs
# them, and the test job has already gated the release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dev dependencies
        run: bun install --frozen-lockfile
      - name: Preflight
        run: bun run preflight

  publish:
    needs: test
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token npm exchanges for a short-lived publish credential.
      # Without this, npm falls back to looking for a token and fails.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1, and Node 22 ships npm 10.x.
      # No NODE_AUTH_TOKEN anywhere: npm authenticates from the OIDC token.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
      # A trusted publisher attaches to an existing package page — npm's own
      # setup path is "Packages -> YOUR_PACKAGE -> Settings -> Trusted
      # publishing" — so npm cannot create a brand-new package from an OIDC
      # token and answers E404 on the PUT. Fail here with the remedy instead.
      # (A *mismatched* trusted publisher gives ENEEDAUTH, not 404, so the two
      # failure modes are distinguishable.)
      - name: Check the package exists on the registry
        run: |
          name="$(node -p "require('./package.json').name")"
          if npm view "$name" version >/dev/null 2>&1; then
            echo "$name is on the registry"
          else
            echo "::error::$name has never been published, and trusted publishing cannot create a new package. Publish the first version manually (npm login && npm publish --access public), then add the trusted publisher on the package page. See the README's Publishing section."
            exit 1
          fi
      # npm validates that repository.url matches the repository the workflow
      # runs in, and the mismatch surfaces as a confusing publish failure.
      - name: Check repository.url matches this repository
        run: |
          declared="$(node -p "require('./package.json').repository.url" | sed -e 's|^git+||' -e 's|\.git$||')"
          actual="https://github.com/${GITHUB_REPOSITORY}"
          if [ "$declared" != "$actual" ]; then
            echo "::error::package.json repository.url is '$declared' but this workflow runs in '$actual'"
            exit 1
          fi
          echo "repository.url matches $actual"
      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::release tag '$tag' does not match package.json version '$version'"
            exit 1
          fi
          echo "publishing $version"
      - name: Inspect the tarball
        run: npm pack --dry-run
      - name: Publish
        run: npm publish --access public --provenance

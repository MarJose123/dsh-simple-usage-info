# Tests on every push and pull request; publishes to npm when a version tag is
# pushed from main. Publishing uses npm Trusted Publishing via GitHub OIDC.
#
# CI uses npm for compatibility. The publish job also uses npm for version
# alignment, packing, and publishing.
name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
      - "[0-9]*"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Preflight
        run: npm run preflight

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The OIDC token npm exchanges for a short-lived publish credential.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1.
      # No NODE_AUTH_TOKEN is needed: npm authenticates through GitHub OIDC.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Verify tag belongs to main
        run: |
          git fetch origin main --tags

          tag_ref="${GITHUB_REF_NAME}"
          tag_commit="$(git rev-list -n 1 "$tag_ref")"

          if git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tag '$tag_ref' belongs to main"
          else
            echo "::error::Tag '$tag_ref' does not point to a commit contained in main"
            exit 1
          fi

      - name: Align package.json version with tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"

          echo "Tag version: $tag_version"
          echo "package.json version: $package_version"

          if [ "$tag_version" != "$package_version" ]; then
            npm version "$tag_version" --no-git-tag-version --allow-same-version

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add package.json package-lock.json npm-shrinkwrap.json 2>/dev/null || true

            if ! git diff --cached --quiet; then
              git commit -m "chore: align package version with ${GITHUB_REF_NAME}"
              git push origin HEAD:main
            else
              echo "No version changes to commit"
            fi
          else
            echo "package.json already matches tag"
          fi

      # A trusted publisher attaches to an existing package page. It cannot create
      # the very first publish of a package.
      - name: Check the package exists on the registry
        run: |
          name="$(node -p "require('./package.json').name")"
          if npm view "$name" version >/dev/null 2>&1; then
            echo "$name is on the registry"
          else
            echo "::error::$name has never been published, and trusted publishing cannot create a new package. Publish the first version manually, then configure trusted publishing on npm."
            exit 1
          fi

      - name: Check repository.url matches this repository
        run: |
          declared="$(node -p "require('./package.json').repository.url" | sed -e 's|^git+||' -e 's|\.git$||')"
          actual="https://github.com/${GITHUB_REPOSITORY}"

          if [ "$declared" != "$actual" ]; then
            echo "::error::package.json repository.url is '$declared' but this workflow runs in '$actual'"
            exit 1
          fi

          echo "repository.url matches $actual"

      - name: Inspect the tarball
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --access public --provenance
